name: 'Build & Test'

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Jellyfin.Plugin.JellyRoulette
  PLUGIN_NAME: JellyRoulette
  PLUGIN_GUID: f299f82b-8485-4547-be7c-14e0e10e3b2c
  PLUGIN_OWNER: ysflamine

jobs:
  # ==========================================================================
  # 0) SANITY — barato y rápido: inspecciona el árbol antes de compilar nada.
  #
  # Caza la clase de errores que no aparecen hasta que alguien intenta instalar
  # el plugin: BOM en los archivos, GUID distinto en los cuatro sitios donde debe
  # coincidir, recursos embebidos que apuntan a un archivo inexistente, manifests
  # con sintaxis Markdown en la URL o con claves que el servidor no reconoce, y
  # documentación privada que no debería publicarse.
  # ==========================================================================
  sanity:
    name: 'Sanity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Verificar la integridad del repositorio'
        run: python3 .github/scripts/verify.py repo

  # ==========================================================================
  # 1) TESTS — puerta de entrada: si esto falla, no se publica nada
  # ==========================================================================
  test:
    name: 'Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Instalar .NET 10'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 'Tests del backend (xUnit)'
        run: dotnet test tests/JellyRoulette.Tests --nologo -v minimal

      - name: 'Instalar Node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 'Tests del frontend (jsdom)'
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          node test-frontend.js
          node test-preview.js

  # ==========================================================================
  # 2) BUILD — una matriz, un .zip por rama de Jellyfin
  #
  # Jellyfin 12 SOLO acepta paquetes .zip desde un repositorio: en
  # InstallationManager.PerformPackageInstallation, si el sourceUrl no termina
  # en ".zip" se registra "Only zip packages are supported" y la instalación se
  # aborta en silencio. El zip debe llevar la DLL y el meta.json EN SU RAÍZ,
  # porque el servidor hace ZipFile.ExtractToDirectory sobre plugins/<Nombre>/.
  # ==========================================================================
  build:
    name: 'Build (${{ matrix.label }})'
    runs-on: ubuntu-latest
    needs: [ sanity, test ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'jf12'
            label: 'jellyfin-12'
            sdk: '10.0.x'
            zip: 'jellyroulette_12.zip'
            abi: '12.0.0.0'
          - target: 'jf10'
            label: 'jellyfin-10.11'
            sdk: '9.0.x'
            zip: 'jellyroulette_10.11.zip'
            abi: '10.11.0.0'

    steps:
      - uses: actions/checkout@v4

      - name: 'Instalar .NET'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: 'Compilar'
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -o publish
          -p:JellyfinTarget=${{ matrix.target }}
          --nologo
          /p:GenerateFullPaths=true

      # Las dos variantes producen una DLL con EL MISMO nombre de archivo. Si se
      # suben sueltas a la release, GitHub las deduplica por nombre y solo
      # sobrevive una (ese era el fallo del workflow anterior). De ahí el .zip
      # con nombre propio por variante.
      - name: 'Empaquetar en .zip (dll + meta.json en la raíz)'
        run: |
          set -euo pipefail
          cd publish
          test -f ${{ env.PROJECT }}.dll
          test -f meta.json
          zip -q ../${{ matrix.zip }} ${{ env.PROJECT }}.dll meta.json
          cd ..
          echo "Contenido del paquete:"
          unzip -l ${{ matrix.zip }}
          echo "MD5: $(md5sum ${{ matrix.zip }} | awk '{print toupper($1)}')"

      - name: 'Subir artefacto'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          retention-days: 90

  # ==========================================================================
  # 3) RELEASE — solo con tags v*.
  #
  # Genera los manifests con el MD5 REAL de cada zip. El servidor lo compara con
  # Convert.ToHexString(MD5.HashData(...)) y lanza InvalidDataException si no
  # coincide, así que el checksum NUNCA debe escribirse a mano.
  # ==========================================================================
  release:
    name: 'Release'
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # merge-multiple: los dos zips quedan planos en dist/ (tienen nombres distintos)
      - name: 'Descargar paquetes'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 'Generar los manifests'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          make_manifest() {  # $1=salida  $2=zip  $3=targetAbi
            local out="$1" zip="$2" abi="$3" ver log sum
            # La versión y el changelog se leen del meta.json que va DENTRO del
            # zip: así el manifest y el meta.json no pueden desincronizarse.
            ver="$(unzip -p "dist/${zip}" meta.json | jq -r '.version')"
            log="$(unzip -p "dist/${zip}" meta.json | jq -r '.changelog')"
            sum="$(md5sum "dist/${zip}" | awk '{print toupper($1)}')"

            jq -n \
              --arg guid  "${{ env.PLUGIN_GUID }}" \
              --arg name  "${{ env.PLUGIN_NAME }}" \
              --arg owner "${{ env.PLUGIN_OWNER }}" \
              --arg ver   "$ver" \
              --arg abi   "$abi" \
              --arg url   "${BASE}/${zip}" \
              --arg sum   "$sum" \
              --arg ts    "$TS" \
              --arg log   "$log" \
              --arg img   "https://raw.githubusercontent.com/ysflamine/JellyRoulette/main/docs/logo.svg" \
              --arg desc  "Ruleta 3D de pósters integrada en la cabecera de Jellyfin: elige género, tipo de medio, biblioteca y si solo quieres títulos no vistos, y deja que el azar decida qué ver." \
              --arg over  "Ruleta aleatoria de películas y series para la interfaz web de Jellyfin" \
              '[{
                 guid:        $guid,
                 name:        $name,
                 imageUrl:    $img,
                 description: $desc,
                 overview:    $over,
                 owner:       $owner,
                 category:    "General",
                 versions: [{
                   version:    $ver,
                   changelog:  $log,
                   targetAbi:  $abi,
                   sourceUrl:  $url,
                   checksum:   $sum,
                   timestamp:  $ts
                 }]
               }]' > "$out"

            echo "--- $out ---"; cat "$out"
          }

          # Un manifest POR RAMA de Jellyfin. No se pueden mezclar en el mismo
          # archivo: el filtro del servidor es `targetAbi <= versionServidor`
          # (es un mínimo, no una coincidencia exacta). Un servidor 12.x vería
          # también la entrada 10.11 y, al tener ambas la misma versión, podría
          # instalar la DLL de .NET 9, que no carga en .NET 10.
          make_manifest dist/manifest.json        jellyroulette_12.zip     12.0.0.0
          make_manifest dist/manifest-10.11.json  jellyroulette_10.11.zip  10.11.0.0

      - name: 'Crear la release'
        uses: softprops/action-gh-release@v2
        with:
          name: 'JellyRoulette ${{ github.ref_name }}'
          files: |
            dist/jellyroulette_12.zip
            dist/jellyroulette_10.11.zip
            dist/manifest.json
            dist/manifest-10.11.json
          generate_release_notes: true
          draft: false
          prerelease: false

      # Los manifests generados se escriben en dist/ (sin seguimiento), así que
      # cambiar de rama no provoca conflictos: se copian encima al final.
      - name: 'Publicar los manifests en main'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp dist/manifest.json dist/manifest-10.11.json .
          git add manifest.json manifest-10.11.json
          if git diff --cached --quiet; then
            echo "Los manifests ya estaban actualizados."
          else
            git commit -m "chore(release): manifests generados para ${TAG} [skip ci]"
            git push origin main
          fi

  # ==========================================================================
  # 4) VERIFY — comprueba lo que un servidor Jellyfin va a descargar de verdad.
  #
  # Este es el job que habría detectado los cinco fallos que rompían la
  # instalación desde el catálogo: descarga cada sourceUrl, recalcula su MD5 y lo
  # compara con el checksum declarado, abre el zip para confirmar que la DLL y el
  # meta.json están en la raíz (que es donde los extrae el servidor), verifica que
  # meta.json y manifest coincidan en guid/version/targetAbi, y que la DLL sea del
  # target framework que corresponde a ese targetAbi.
  #
  # Con reintentos: la CDN de raw.githubusercontent puede tardar unos segundos en
  # servir el manifest que la CI acaba de commitear en main.
  # ==========================================================================
  verify:
    name: 'Verify (release publicada)'
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: 'Validar los artefactos publicados'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for intento in 1 2 3 4; do
            echo "--- intento $intento ---"
            if python3 .github/scripts/verify.py release --tag "$TAG" --repo "$REPO"; then
              echo "Verificación superada."
              exit 0
            fi
            [ "$intento" -lt 4 ] && { echo "Esperando 30 s a que la CDN se refresque…"; sleep 30; }
          done
          echo "::error::La release publicada no pasa la verificación."
          exit 1
